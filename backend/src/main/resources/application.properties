# =============================================================================
# JobTrack - Spring Boot Application Configuration
# =============================================================================

spring.application.name=JobTrack-Backend
server.port=8080

# Profiles: Default is 'dev' (zero-config embedded DB with auto-seeding). Set to 'mysql' for MySQL 8+
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Resume File Storage Directory
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/resumes}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
