version: '3.8'

services:
  # 1. MySQL 8 Database Service
  mysql:
    image: mysql:8.0
    container_name: jobtrack-mysql
    restart: always
    environment:
      MYSQL_DATABASE: jobtrack_db
      MYSQL_USER: jobtrack_user
      MYSQL_PASSWORD: JobTrack@2026!
      MYSQL_ROOT_PASSWORD: RootPassword@2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword@2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtrack-network

  # 2. Spring Boot 3 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrack-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jobtrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: jobtrack_user
      SPRING_DATASOURCE_PASSWORD: JobTrack@2026!
      FILE_UPLOAD_DIR: /app/uploads/resumes
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - resume_uploads:/app/uploads/resumes
    networks:
      - jobtrack-network

  # 3. React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtrack-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - jobtrack-network

volumes:
  mysql_data:
  resume_uploads:

networks:
  jobtrack-network:
    driver: bridge
